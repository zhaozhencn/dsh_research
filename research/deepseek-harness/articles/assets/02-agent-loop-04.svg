<text x="980" y="507" text-anchor="middle" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="31" fill="#16324e">不再新增派发</text>
<path d="M842,531 L1118,531" fill="none" stroke="#6f8aa5" stroke-width="4"/>
<text x="980" y="620" text-anchor="middle" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="31" fill="#16324e">结算在途与边界</text>
<path d="M842,644 L1118,644" fill="none" stroke="#6f8aa5" stroke-width="4"/>
<text x="980" y="733" text-anchor="middle" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="31" fill="#16324e">保留合理失败事实</text>
<path d="M842,757 L1118,757" fill="none" stroke="#6f8aa5" stroke-width="4"/>
<text x="980" y="846" text-anchor="middle" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="31" fill="#16324e">idle 不代表业务完成</text>
<path d="M842,870 L1118,870" fill="none" stroke="#6f8aa5" stroke-width="4"/>
<text x="600" y="1054" text-anchor="middle" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" fill="#526b85">await 之后仍可能出现输入或生命周期变化</text>
