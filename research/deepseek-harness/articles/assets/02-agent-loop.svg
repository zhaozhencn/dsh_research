<text x="600.0" y="1110" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="46" fill="#182d49">工具 / executeToolCalls()</text>
<text x="600.0" y="1167" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="34" fill="#516781">runGroup() 调度；结果与额外上下文分别回流</text>
