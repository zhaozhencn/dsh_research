<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1628" viewBox="0 0 1200 1628">
<rect width="100%" height="100%" fill="#f6f8fb"/>
<text x="600" y="61" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="34" fill="#516781">02 / 从源码理解 Agent Harness</text>
<text x="600" y="135" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="52" fill="#182d49">Agent Loop 的组件与执行主线</text>
