<text x="600.0" y="513" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="34" fill="#516781">wakeDriver() → kick() → turn()</text>
<line x1="600" y1="552" x2="600" y2="596" stroke="#7390ac" stroke-width="4"/><polygon points="600,596 591,582 609,582" fill="#7390ac"/>
