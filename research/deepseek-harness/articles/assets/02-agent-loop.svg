<text x="600.0" y="731" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="34" fill="#516781">claim 输入、组装上下文、决定是否进入 Step</text>
<line x1="600" y1="770" x2="600" y2="814" stroke="#7390ac" stroke-width="4"/><polygon points="600,814 591,800 609,800" fill="#7390ac"/>
