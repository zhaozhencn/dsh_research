<text x="600.0" y="949" text-anchor="middle" font-family="Heiti SC, PingFang SC, sans-serif" font-size="34" fill="#516781">prepareRequest() → buildRequest() → stream()</text>
<line x1="600" y1="988" x2="600" y2="1032" stroke="#7390ac" stroke-width="4"/><polygon points="600,1032 591,1018 609,1018" fill="#7390ac"/>
